# Per-checkout runtime config, read from the CWD. Only [persistent] is used.
# Precedence: defaults < config file < this file < env vars < CLI flags.
[persistent]
# HTTP bridge port (default: 7676). CLI flag --http overrides this.
http-port = 7676

# Data directory for recipes, sessions, trim stats, PFC1 memory (default: ./data)
data-dir = "./data"

# herdr daemon socket path. Unset: $HERDR_SOCKET_PATH, else the named
# session's socket ($HERDR_SESSION), else ~/.config/herdr/herdr.sock.
# herdr-socket = "~/.config/herdr/herdr.sock"
