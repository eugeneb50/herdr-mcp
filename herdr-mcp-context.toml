# herdr plugin + recipe triggers (feat/herdr-plugin, stacked on #26)
#
# - `herdr-mcp plugin link` writes ~/.config/herdr-mcp/herdr-plugin/herdr-plugin.toml
#   (generated by crates/herdr-mcp-cli/src/plugin.rs::manifest) and runs
#   `herdr plugin link`. Actions: recipes (popup picker), bridge (tab),
#   dashboard (split), web. Plugin registry is GLOBAL per user — test with
#   XDG_CONFIG_HOME=<short /tmp dir> (scratchpad paths overflow sun_path).
# - Actions run without a terminal; `plugin open <pane>` forwards
#   HERDR_PLUGIN_CONTEXT_JSON to the pane via `--env HERDR_MCP_CONTEXT=…`.
# - herdr wire event names: global events are `pane_created`,
#   subscription events are `pane.agent_status_changed`;
#   HerdrEvent::parse normalizes to the dotted subscription name.
# - herdr reads nothing after events.subscribe on a connection: the
#   subscriber reconnects on pane.created/pane.closed (old resubscribe
#   channel was dead code; workspace.created handler never fired).
# - Agent going working -> idle is reported as `done` when unseen, `idle`
#   when seen: triggers filtering on status need to know which.
# - serve_core builds ONE HerdrMcpServer (was 3 → schedules fired 3x).
# - Tests run under `cargo nextest run --workspace` (process per test, so the
#   env-var-setting tests can't race). No doctests exist; add `cargo test
#   --doc` to the gates if one is ever written. 400 tests at the plugin PR.
