[workspace]
resolver = "2"
members = [
    "crates/herdr-mcp-api",
    "crates/herdr-mcp-core",
    "crates/herdr-mcp-tui",
    "crates/herdr-mcp-server",
    "crates/herdr-mcp-cli",
    "crates/herdr-mcp-ui",
]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
rmcp = { version = "1.7", features = ["server", "client", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
crossterm = "0.29"
ratatui = "0.30"
unicode-width = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5"
toml = "0.8"
toml_edit = "0.22"
tempfile = "3"
pretty_assertions = "1"
assert_cmd = "2"
predicates = "3"

[workspace.lints.clippy]
# Production code handles errors or states the invariant with `expect`;
# tests may unwrap (clippy.toml: allow-unwrap-in-tests).
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3
