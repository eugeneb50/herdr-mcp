[workspace]
resolver = "2"
members = [
    "crates/herdr-mcp-core",
    "crates/herdr-mcp-trim",
    "crates/herdr-mcp-server",
    "crates/herdr-mcp-cli",
]

[workspace.dependencies]
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
regex = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
dashmap = "6"
lazy_static = "1"
crossterm = "0.28"
dirs = "5"
toml = "0.8"
tempfile = "3"
pretty_assertions = "1"
rstest = "0.23"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3
