[package]
name = "herdr-mcp-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "herdr-mcp"
path = "src/bin/herdr-mcp.rs"

[[bin]]
name = "herdr-trim"
path = "src/bin/herdr-trim.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rmcp = { workspace = true, features = ["server", "transport-io", "macros"] }
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }

herdr-mcp-api = { path = "../herdr-mcp-api" }
herdr-mcp-core = { path = "../herdr-mcp-core" }
herdr-mcp-server = { path = "../herdr-mcp-server" }
herdr-mcp-trim = { path = "../herdr-mcp-trim" }
herdr-mcp-tui = { path = "../herdr-mcp-tui" }
herdr-mcp-proxy = { path = "../herdr-mcp-proxy" }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
