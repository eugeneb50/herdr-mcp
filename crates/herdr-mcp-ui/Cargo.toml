[package]
name = "herdr-mcp-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "herdr-mcp-ui"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
serde_json = { workspace = true }
herdr-mcp-api = { path = "../herdr-mcp-api" }
web-sys = { version = "0.3", features = ["Window", "Location", "EventSource", "MessageEvent", "Storage", "Document", "Element"] }
wasm-bindgen = "0.2"
