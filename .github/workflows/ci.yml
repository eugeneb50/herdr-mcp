# On every PR and push to main: the gates AGENTS.md lists. No web bundle —
# the server builds and tests without it (build.rs embeds one only if dx
# has made it).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (wasm)
        run: cargo clippy -p herdr-mcp-api -p herdr-mcp-ui --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --locked
